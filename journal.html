<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal - Life Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            dark: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              text: '#f8fafc',
              muted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen flex">
  
  <aside class="w-64 bg-dark-card border-r border-dark-border flex flex-col fixed h-full">
    <div class="p-6 border-b border-dark-border">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
        Life Dashboard
      </h1>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-dark-muted hover:bg-dark-bg hover:text-white rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Aujourd'hui
      </a>
      <a href="journal.html" class="flex items-center gap-3 px-4 py-3 bg-primary/10 text-primary rounded-lg font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        Journal
      </a>
      <a href="sport.html" class="flex items-center gap-3 px-4 py-3 text-dark-muted hover:bg-dark-bg hover:text-white rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        Sport
      </a>
      <a href="planning.html" class="flex items-center gap-3 px-4 py-3 text-dark-muted hover:bg-dark-bg hover:text-white rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Planning
      </a>
    </nav>

    <div class="p-4 border-t border-dark-border">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold" id="user-avatar">?</div>
        <div>
          <p class="text-sm font-medium" id="user-name">Chargement...</p>
          <p class="text-xs text-dark-muted" id="user-email">...</p>
        </div>
      </div>
      <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-dark-bg hover:bg-red-500/10 hover:text-red-400 text-dark-muted rounded-lg transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <main class="flex-1 ml-64 p-8">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-3xl font-bold mb-1">Mon Journal 📓</h2>
        <p class="text-dark-muted">Capture tes pensées, idées et réflexions.</p>
      </div>
      <button id="new-entry-btn" class="bg-primary hover:bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Nouvelle entrée
      </button>
    </header>

    <div class="mb-6">
      <input type="text" id="search-input" placeholder="Rechercher dans mes entrées..." class="w-full bg-dark-card border border-dark-border rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-colors">
    </div>

    <div id="entries-container" class="space-y-4">
      <div class="text-center py-12 text-dark-muted">
        <p>Chargement...</p>
      </div>
    </div>
  </main>

  <div id="entry-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-dark-border flex justify-between items-center">
        <h3 class="text-xl font-bold" id="modal-title">Nouvelle entrée</h3>
        <button id="close-modal" class="text-dark-muted hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <form id="entry-form" class="p-6 space-y-4">
        <input type="hidden" id="entry-id">
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Titre</label>
          <input type="text" id="entry-title" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 focus:outline-none focus:border-primary" placeholder="Ex: Idée de projet...">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Contenu</label>
          <textarea id="entry-content" rows="6" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 focus:outline-none focus:border-primary resize-none" placeholder="Écris tes pensées ici..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Humeur</label>
            <div class="flex gap-2">
              <button type="button" class="mood-btn text-2xl p-2 rounded-lg border border-transparent hover:bg-dark-bg" data-mood="😄">😄</button>
              <button type="button" class="mood-btn text-2xl p-2 rounded-lg border border-transparent hover:bg-dark-bg" data-mood="🙂">🙂</button>
              <button type="button" class="mood-btn text-2xl p-2 rounded-lg border border-transparent hover:bg-dark-bg" data-mood="😐">😐</button>
              <button type="button" class="mood-btn text-2xl p-2 rounded-lg border border-transparent hover:bg-dark-bg" data-mood="😔">😔</button>
              <button type="button" class="mood-btn text-2xl p-2 rounded-lg border border-transparent hover:bg-dark-bg" data-mood="😡">😡</button>
            </div>
            <input type="hidden" id="entry-mood" value="😐">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Tags (séparés par des virgules)</label>
            <input type="text" id="entry-tags" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 focus:outline-none focus:border-primary" placeholder="idée, projet, personnel">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-dark-border">
          <button type="button" id="delete-entry-btn" class="hidden text-red-400 hover:bg-red-400/10 px-4 py-2 rounded-lg transition-colors">Supprimer</button>
          <div class="flex-1"></div>
          <button type="button" id="cancel-btn" class="px-4 py-2 text-dark-muted hover:text-white transition-colors">Annuler</button>
          <button type="submit" class="bg-primary hover:bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg transition-colors">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nmycrlkzunqhknjsnnrd.supabase.co' 
    const SUPABASE_ANON_KEY = 'sb_publishable_stM5nGMVAfh8BkUh2wft8w_2jpixnRk' 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    let currentUser = null;
    let allEntries = [];

    window.addEventListener('DOMContentLoaded', async () => {
      console.log('🚀 Journal.html chargé')
      
      const { data: { session } } = await supabaseClient.auth.getSession()
      
      if (!session) {
        console.log('❌ Pas de session - Redirection vers login')
        window.location.href = 'login.html?redirect=journal.html'
        return;
      }
      
      console.log('✅ Session trouvée:', session.user.email)
      currentUser = session.user;
      
      await loadUserProfile();
      await loadEntries();
      
      attachEventListeners();
      
      console.log('✅ Journal prêt')
    });

    async function loadUserProfile() {
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('full_name')
        .eq('id', currentUser.id)
        .single()

      const name = profile?.full_name || currentUser.email.split('@')[0]
      document.getElementById('user-name').textContent = name
      document.getElementById('user-email').textContent = currentUser.email
      document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase()
    }

    async function loadEntries() {
      const { data, error } = await supabaseClient
        .from('journal_entries')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })

      if (error) {
        console.error(' Erreur chargement:', error)
        document.getElementById('entries-container').innerHTML = '<p class="text-red-400">Erreur de chargement</p>';
        return;
      }

      console.log('✅ Entrées chargées:', data.length)
      allEntries = data;
      renderEntries(allEntries);
    }

    function renderEntries(entries) {
      const container = document.getElementById('entries-container')
      
      if (entries.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-dark-muted">
            <p>Aucune entrée pour le moment. Clique sur "Nouvelle entrée" pour commencer !</p>
          </div>
        `
        return;
      }

      container.innerHTML = entries.map(entry => {
        const date = new Date(entry.created_at).toLocaleDateString('fr-FR', { 
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        })
        const tagsHtml = entry.tags && entry.tags.length > 0 
          ? entry.tags.map(tag => `<span class="text-xs bg-primary/10 text-primary px-2 py-1 rounded">${tag}</span>`).join(' ')
          : ''

        return `
          <div class="bg-dark-card border border-dark-border rounded-xl p-6 hover:border-primary/50 transition-colors cursor-pointer entry-card" data-id="${entry.id}">
            <div class="flex justify-between items-start mb-3">
              <div>
                <h3 class="font-semibold text-lg">${entry.title || 'Sans titre'}</h3>
                <p class="text-sm text-dark-muted capitalize">${date}</p>
              </div>
              <div class="text-2xl">${entry.mood || '😐'}</div>
            </div>
            <p class="text-slate-300 whitespace-pre-wrap mb-4">${entry.content.substring(0, 200)}${entry.content.length > 200 ? '...' : ''}</p>
            <div class="flex gap-2 flex-wrap">${tagsHtml}</div>
          </div>
        `
      }).join('')

      document.querySelectorAll('.entry-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          console.log('📝 Clic sur entrée:', id)
          openModal(id);
        })
      })
    }


    function attachEventListeners() {
      console.log('🔧 Attachment des événements...')
      
      const newEntryBtn = document.getElementById('new-entry-btn')
      console.log('🔍 Bouton trouvé:', newEntryBtn)
      
      newEntryBtn.addEventListener('click', (e) => {
        e.preventDefault();
        console.log('🟢 CLIC SUR NOUVELLE ENTRÉE !')
        openModal();
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut()
        window.location.href = 'login.html'
      });

      document.getElementById('close-modal').addEventListener('click', closeModal);
      document.getElementById('cancel-btn').addEventListener('click', closeModal);
      document.getElementById('delete-entry-btn').addEventListener('click', deleteEntry);

      document.querySelectorAll('.mood-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mood-btn').forEach(b => {
            b.classList.remove('border-primary', 'bg-primary/10')
          })
          e.currentTarget.classList.add('border-primary', 'bg-primary/10')
          document.getElementById('entry-mood').value = e.currentTarget.dataset.mood
        })
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase()
        const filtered = allEntries.filter(entry => 
          (entry.title && entry.title.toLowerCase().includes(query)) || 
          entry.content.toLowerCase().includes(query)
        )
        renderEntries(filtered)
      });

      document.getElementById('entry-form').addEventListener('submit', saveEntry);
      
      console.log('✅ Tous les événements sont attachés')
    }

    function openModal(entryId = null) {
      console.log('📂 Ouverture modal, ID:', entryId)
      
      const modal = document.getElementById('entry-modal')
      const form = document.getElementById('entry-form')
      const deleteBtn = document.getElementById('delete-entry-btn')
      
      form.reset()
      document.getElementById('entry-id').value = ''
      document.getElementById('modal-title').textContent = 'Nouvelle entrée'
      deleteBtn.classList.add('hidden')
      
      document.querySelectorAll('.mood-btn').forEach(b => {
        b.classList.remove('border-primary', 'bg-primary/10')
      })
      document.getElementById('entry-mood').value = '😐'

      if (entryId) {
        const entry = allEntries.find(e => e.id === entryId)
        if (entry) {
          document.getElementById('modal-title').textContent = 'Modifier l\'entrée'
          document.getElementById('entry-id').value = entry.id
          document.getElementById('entry-title').value = entry.title || ''
          document.getElementById('entry-content').value = entry.content
          document.getElementById('entry-tags').value = entry.tags ? entry.tags.join(', ') : ''
          document.getElementById('entry-mood').value = entry.mood || ''
          
          document.querySelectorAll('.mood-btn').forEach(b => {
            b.classList.remove('border-primary', 'bg-primary/10')
            if (b.dataset.mood === entry.mood) {
              b.classList.add('border-primary', 'bg-primary/10')
            }
          })
          deleteBtn.classList.remove('hidden')
        }
      }

      modal.classList.remove('hidden')
      modal.classList.add('flex')
    }

    function closeModal() {
      const modal = document.getElementById('entry-modal')
      modal.classList.add('hidden')
      modal.classList.remove('flex')
    }

    async function saveEntry(e) {
      e.preventDefault()
      console.log('💾 Sauvegarde...')
      
      const id = document.getElementById('entry-id').value
      const title = document.getElementById('entry-title').value
      const content = document.getElementById('entry-content').value
      const mood = document.getElementById('entry-mood').value
      const tagsStr = document.getElementById('entry-tags').value
      const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : []

      const entryData = {
        user_id: currentUser.id,
        title,
        content,
        mood,
        tags,
        entry_date: new Date().toISOString().split('T')[0]
      }

      let error;
      if (id) {
        const res = await supabaseClient.from('journal_entries').update(entryData).eq('id', id)
        error = res.error
      } else {
        const res = await supabaseClient.from('journal_entries').insert(entryData)
        error = res.error
      }

      if (error) {
        alert('Erreur: ' + error.message)
      } else {
        closeModal()
        await loadEntries()
      }
    }

    async function deleteEntry() {
      const id = document.getElementById('entry-id').value
      if (!id) return;

      if (!confirm('Supprimer cette entrée ?')) return;

      const { error } = await supabaseClient.from('journal_entries').delete().eq('id', id)

      if (error) {
        alert('Erreur: ' + error.message)
      } else {
        closeModal()
        await loadEntries()
      }
    }
  </script>
</body>
</html>
