<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Life Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <h1 class="text-4xl font-bold text-center mb-8 text-indigo-400">Life Dashboard</h1>
    
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8">
      
      <div class="flex gap-2 mb-6">
        <button 
          id="show-login"
          class="flex-1 py-2 px-4 rounded-lg font-medium bg-indigo-600 text-white transition-all"
        >
          Connexion
        </button>
        <button 
          id="show-signup"
          class="flex-1 py-2 px-4 rounded-lg font-medium bg-slate-700 text-slate-300 transition-all"
        >
          Inscription
        </button>
      </div>

      <form id="auth-form" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-sm font-medium text-slate-300 mb-1">Nom complet</label>
          <input 
            type="text" 
            id="full-name" 
            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500"
            placeholder="John Doe"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input 
            type="email" 
            id="email" 
            required
            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500"
            placeholder="ton@email.com"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            required
            minlength="6"
            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500"
            placeholder="••••••••"
          >
        </div>

        <div id="message" class="hidden text-sm rounded-lg p-3"></div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition-colors disabled:opacity-50"
        >
          <span id="btn-text">Se connecter</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nmycrlkzunqhknjsnnrd.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_stM5nGMVAfh8BkUh2wft8w_2jpixnRk'
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    
    console.log('✅ Script chargé !')
    
    let mode = 'login'
    
    const loginBtn = document.getElementById('show-login')
    const signupBtn = document.getElementById('show-signup')
    const nameField = document.getElementById('name-field')
    const btnText = document.getElementById('btn-text')
    
    loginBtn.addEventListener('click', function() {
      console.log(' Clic sur Connexion')
      mode = 'login'
      updateTabs()
    })
    
    signupBtn.addEventListener('click', function() {
      console.log('🟢 Clic sur Inscription')
      mode = 'signup'
      updateTabs()
    })
    
    function updateTabs() {
      console.log('Mode actuel:', mode)
      
      if (mode === 'login') {
        loginBtn.classList.add('bg-indigo-600', 'text-white')
        loginBtn.classList.remove('bg-slate-700', 'text-slate-300')
        signupBtn.classList.remove('bg-indigo-600', 'text-white')
        signupBtn.classList.add('bg-slate-700', 'text-slate-300')
        nameField.classList.add('hidden')
        btnText.textContent = 'Se connecter'
      } else {
        signupBtn.classList.add('bg-indigo-600', 'text-white')
        signupBtn.classList.remove('bg-slate-700', 'text-slate-300')
        loginBtn.classList.remove('bg-indigo-600', 'text-white')
        loginBtn.classList.add('bg-slate-700', 'text-slate-300')
        nameField.classList.remove('hidden')
        btnText.textContent = "S'inscrire"
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const fullName = document.getElementById('full-name').value
      const messageDiv = document.getElementById('message')
      const btn = document.getElementById('submit-btn')
      
      messageDiv.classList.add('hidden')
      btn.disabled = true
      btnText.textContent = 'Chargement...'
      
      try {
        if (mode === 'login') {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          })
          
          if (error) throw error
          
          showMessage('✅ Connexion réussie !', 'success')
          setTimeout(() => {
            window.location.href = 'index.html'
          }, 1000)
          
        } else {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: fullName }
            }
          })
          
          if (error) throw error
          
          showMessage('✅ Compte créé !', 'success')
          setTimeout(() => {
            window.location.href = 'index.html'
          }, 1000)
        }
      } catch (error) {
        console.error('Erreur:', error)
        showMessage('❌ ' + error.message, 'error')
        btn.disabled = false
        btnText.textContent = mode === 'login' ? 'Se connecter' : "S'inscrire"
      }
    })
    
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message')
      messageDiv.textContent = text
      messageDiv.classList.remove('hidden')
      
      if (type === 'success') {
        messageDiv.classList.remove('text-red-400', 'bg-red-400/10')
        messageDiv.classList.add('text-green-400', 'bg-green-400/10')
      } else {
        messageDiv.classList.remove('text-green-400', 'bg-green-400/10')
        messageDiv.classList.add('text-red-400', 'bg-red-400/10')
      }
    }
  </script>
</body>
</html>
